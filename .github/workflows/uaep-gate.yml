name: UAEP-000001 Platform Binding Gate

# UAEP-000001 — the platform capability binding register.
#
# The platform agreement names sixteen capabilities. Fifteen already had a canonical home in
# this repository and one had none. This gate asserts that every one of those names still
# resolves to a home that exists, so a rename, a move or a deletion closes the gate instead of
# quietly invalidating the agreement. It is the executable form of the agreement itself.
#
# The programme creates no engine, registry, catalogue, identity, graph or pipeline. Thirteen of
# the sixteen names resolve inside platform/universal_pipeline (RC-56, replacement_prohibited),
# two resolve under different canonical names and are recorded as naming gaps rather than closed
# by building a second home. Every capability, home, symbol, vocabulary, pipeline category and
# validation dimension is DATA in 00-MASTER/UAEP-000001/uaep-platform.json.
#
# Fail-closed properties worth naming, because each closes a defect class this repository has
# actually suffered:
#   * a declared validation dimension the engine does not measure FAILS CLOSED rather than
#     reporting satisfied — absence of evidence is never evidence (the UCCEP fail-open where
#     four blocking checks passed unexecuted).
#   * the gate is proven NON-VACUOUS by unit scenarios: eight distinct mutations drive it to
#     CLOSED, so a gate that always passes cannot go unnoticed.
#   * every input the engine reads is version-controlled, so this gate does not depend on
#     untracked local state — the defect that made other suites pass only on a developer machine
#     and fail on every clean clone.
#
# Exit codes:
#   0  every named capability resolves, every blocking dimension satisfied (gate OPEN)
#   1  a binding or validation dimension is unsatisfied (gate CLOSED), or a self-guard failed
#   2  fail-closed abort — the declaration is unusable, so no verdict may be asserted
#
# Standing: CERTIFIED-PROVISIONAL. AUTHORITY = NONE (DERIVED TRUTH). This programme holds no
# ratification authority; where its register and a canonical owner differ, the owner governs.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: uaep-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-guards:
    name: UAEP self-guards (declaration · zero-enumeration · write-scope · determinism · reuse · open-world)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12 (canonical toolchain series, DE-04)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stdlib only — the guards install nothing. Each is fail-closed on its own.
      - name: Declaration integrity (no duplicate id, no empty mandatory field)
        run: python3 00-MASTER/UAEP-000001/uaep_engine.py --check-declaration

      - name: Zero-enumeration (no capability id or name is hardcoded in the engine source)
        run: python3 00-MASTER/UAEP-000001/uaep_engine.py --check-no-enumeration

      - name: Forbidden-write guard (every rendered target resolves inside this programme)
        run: python3 00-MASTER/UAEP-000001/uaep_engine.py --check-write-scope

      - name: Self-determinism (two renders byte-identical, no wall-clock emitted)
        run: python3 00-MASTER/UAEP-000001/uaep_engine.py --check-determinism

      - name: Reuse-before-create guard (no capability is bound to an artifact this programme owns)
        run: python3 00-MASTER/UAEP-000001/uaep_engine.py --check-reuse-before-create

      - name: Open-world guard (every declared vocabulary names a registrar that exists)
        run: python3 00-MASTER/UAEP-000001/uaep_engine.py --check-open-world

  platform-binding-gate:
    name: Platform Binding Gate (fail-closed)
    runs-on: ubuntu-latest
    needs: self-guards
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12 (canonical toolchain series, DE-04)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Platform Binding Gate (every named capability resolves in Repository Truth)
        run: python3 00-MASTER/UAEP-000001/uaep_engine.py --gate

      # Replay drift: the committed registers must be the deterministic product of the committed
      # declaration. This is assertable here (unlike the roadmap fixed point) because the engine
      # emits no clock and reads no untracked input, so a replay is reproducible by construction.
      - name: Replay drift (committed registers equal a replay of the committed declaration)
        run: |
          python3 00-MASTER/UAEP-000001/uaep_engine.py --render --quiet
          git diff --exit-code -- 00-MASTER/UAEP-000001 \
            || { echo "UAEP-000001 REPLAY DRIFT — committed registers are not the product of the declaration" >&2; exit 1; }

      - name: Publish the binding register
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uaep-binding-register
          path: |
            00-MASTER/UAEP-000001/*.md
            00-MASTER/UAEP-000001/uaep.json

  binding-tests:
    name: Binding suite (non-vacuity — the gate must be able to fail)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12 (canonical toolchain series, DE-04)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned test toolchain
        run: python -m pip install --disable-pip-version-check "pytest==8.3.4"

      # --no-cov: this suite gates the binding, not repository coverage. The coverage floor is
      # owned by ./verify.sh in ec1-ci.yml and is not duplicated here.
      - name: Binding suite (includes the eight scenarios that drive the gate CLOSED)
        run: python -m pytest engine/tests/unit/test_uaep_platform_binding.py -q --no-cov
