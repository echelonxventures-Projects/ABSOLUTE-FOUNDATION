# TASK-000033 — EC-1 Determinism CI Gate (EPIC-004).
# Proves constitutional determinism (IMP-007 §5): the same certified blueprint,
# compiler, and environment definition must produce byte-identical output every
# time. The gate runs the reproducibility harness, detects any byte-level
# divergence, FAILS the build on divergence, and preserves the reproducibility
# and determinism evidence as CI artifacts. Action versions pinned to major tags
# (DE-04). The certified corpus is never modified (DP-03).
name: EC-1 Determinism Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  determinism:
    name: Reproducibility (double-build · fail-on-divergence)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12 (pinned toolchain)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install (pinned dev dependencies)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Reproducibility execution + diff detection + fail-on-divergence
        # ec1-determinism runs double_build("BP-DATA-0001"), compares generated
        # source / manifests / SBOM / signatures / publication payloads byte for
        # byte, writes evidence, and exits non-zero on ANY divergence.
        run: |
          python -m engine.determinism.reproduce BP-DATA-0001 \
            --evidence-dir determinism-evidence

      - name: Determinism integration tests (double-build + divergence detection)
        run: python -m pytest engine/tests/integration/test_determinism.py engine/tests/unit/test_reproduce.py engine/tests/unit/test_hermetic.py -q

      - name: Publish reproducibility & determinism evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: determinism-evidence
          path: determinism-evidence/
          if-no-files-found: warn
