# UCOS Ω∞ — EC-1 Execution Engine (EPIC-001 Foundation)
# TASK-000001: workspace + pinned dependencies (DE-04 pinned/vetted; TP-05 least-sufficient).
# Runtime code uses the Python standard library only (TP-04 vendor-neutral core).
# This project is additive engineering code; it never modifies the certified corpus
# (00-BOOK, 00-SOURCE, 99-FREEZE are read-only — DP-03).

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ucos-ec1-engine"
version = "0.1.0"
description = "UCOS Ω∞ EC-1 Execution Engine — Foundation layer (IMP-001)."
requires-python = ">=3.12"
license = { text = "Proprietary" }
# Runtime dependencies: none. Foundation is stdlib-only by constitutional intent
# (TP-04 Vendor Neutrality of Core, TP-05 Least Sufficient Technology).
dependencies = []

[project.optional-dependencies]
# Canonical verification toolchain — fully pinned (DE-04 pinned/vetted). These are
# the exact versions the canonical verification entry point (verify.sh / make verify)
# installs into the repository-standard virtualenv (.ec1-venv). `coverage` is pinned
# explicitly rather than left to transitive resolution so that the coverage gate is
# byte-for-byte reproducible across machines and CI. See ENVIRONMENT-SETUP.md.
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "coverage==7.15.2",
  "ruff==0.8.4",
  # IMPLEMENT-001B RB-03 (UCCEP-F-006 · WP-UCCEP-004 · OA-3 · conflict CF-03).
  # verify.sh Stage 5 (`ukb.py validate`) validates the emitted DATA against
  # 00-BOOK/SCHEMAS/*.schema.json, but ukb.py:1733-1735 swallows ImportError and
  # still exits 0 — so on a clean bootstrap the stage reported PASS having
  # validated NO schema, which is the exact silent-failure mode that let 539
  # schema violations pass undetected. RELEASE-001 §4 nonetheless requires
  # "Schema + referential integrity PASS" as a release exit criterion.
  # Declaring the pin here is sufficient and complete: ucos_expected_deps()
  # (scripts/ucos-env.sh:104-120) DERIVES the required set by parsing this exact
  # list, so ucos_ensure_venv now installs and verifies jsonschema with no second
  # edit and no hardcoded list anywhere.
  "jsonschema==4.26.0",
]

[project.scripts]
# TASK-000003: frozen-path guard is invocable as a CLI (used by CI + pre-commit).
ec1-frozen-guard = "engine.foundation.guards.frozen_paths:main"
# TASK-000033: determinism reproducibility gate (used by CI).
ec1-determinism = "engine.determinism.reproduce:main"
# EPIC-UKDA: Universal Knowledge & Decision Architecture CLI (Part 13).
ucos-knowledge = "engine.knowledge.cli:main"
# EPIC-UKDA-002: Universal Constitutional Knowledge Integration CLI.
ucos-knowledge-integration = "engine.knowledge.integration.cli:main"
# EPIC-UKDA-003 (Terminal T3): Universal Knowledge Intelligence Platform — admit
# canonical knowledge from unlimited providers, homed exactly once (Knowledge Once).
ucos-knowledge-intelligence = "engine.knowledge.ukip.cli:main"
# UCOS-EPIC-002 (Terminal T2): Universal Knowledge Graph over Registry Truth.
ucos-knowledge-graph = "engine.graph.cli:main"
# UCOS-EPIC-003: Universal Discovery Engine CLI (registry-driven discovery).
ucos-discovery = "engine.discovery.cli:main"
# EPIC-PLAT-003: Repository Operations Automation — the one-command operational
# verification entry point (Terminal T5), orchestrating the canonical engines/scripts.
ucos-repo-ops = "platform.repository_operations.cli:main"
# UCOS-EPIC-004: Universal Measurement Engine (UCOS-UMA-001) — measures Registry Truth.
ucos-measure = "platform.measurement.cli:main"
# UCOS-EPIC-005: Universal Validation Engine (Terminal T5) — the one-command universal
# validation entry point across architecture/implementation/dependency/registry/schema/
# runtime/quality domains (fail-closed, evidence-producing, deterministic).
ucos-validate = "platform.universal_validation.cli:main"
# UCOS-EPIC-013: Continuous Validation Intelligence (Terminal T5) — expands validation
# beyond static rule execution across cross-capability consistency, repository
# completeness, contract/runtime/version compatibility, and architecture/governance
# compliance, producing Validation Intelligence Reports, a Compatibility Engine verdict,
# Compliance Reports, and content-addressed evidence.
ucos-validate-intel = "platform.validation_intelligence.cli:main"
# UCOS-EPIC-001: Universal Registry Platform — validate registrations against the
# single registration authority and emit deterministic evidence (Terminal T1).
ucos-registry = "engine.registry.universal.cli:main"
# UCXI-000001: Universal Context Intelligence — the constitution, taxonomy, ontology,
# registry, resolution, composition, graph, runtime, validation and certification of all
# context (fifteen universal context kinds, open to future context types).
ucos-context = "engine.context.cli:main"
# UCOS-NUC-001: the Nucleus Ownership Authority — capabilities belong to Nuclei; layers and
# compositions own nothing. Its parser already declares `prog="ucos-nucleus"`, so publishing
# the entry point makes `law`/`gate`/`compose`/`lifecycle`/`certify`/`context`/`replay`
# reachable as the one command the capability names for itself, rather than only as
# `python -m`. AUTHORITY = the ownership law it enforces; writes nothing.
ucos-nucleus = "engine.nucleus.cli:main"
# P0-AUTONOMOUS-CONSTITUTIONAL-EXECUTION-001 (UCOS-CEL-0001): the Autonomous Constitutional
# Execution System — dependencies are discovered, execution order is derived, legality is
# proven before execution, mutation passes the gateway, replay reaches a deterministic fixed
# point, and nothing certifies itself. Publishing the entry point makes the fail-closed gates
# (`acceptance`, `legality`, `authority`, `plan`, `replay`, `cycle`) reachable from CI as the
# one command the capability names for itself. AUTHORITY = the execution law it enforces;
# writes nothing. Named for the law rather than "ucos-constitution", which the Foundation's
# own constitution CLI already owns — one name, one owner.
ucos-cel = "engine.constitution.cli:main"
# PROGRAM-002 (UMK-000001): Universal Meta-Kernel — the smallest open-world meta-model.
# Prove constitutional compliance, run the mandatory architectural proof, and emit
# validation/certification evidence. Open by registration; no kernel redesign for unknown
# future concept-categories.
ucos-kernel = "engine.kernel.cli:main"
# PROGRAM-003 (UPF-000001): Universal Provider Framework — the kernel realization layer.
# Register/discover/resolve/select/negotiate/compose/govern providers as open kernel
# meta-objects. Open by registration; no framework redesign for unknown provider categories.
ucos-uprf = "engine.provider.cli:main"
# PROGRAM-004 (MCOS-000001): Universal Meta-Civilization Platform — the layer that generates
# constitutional operating systems. Register dimensions, derive composition from declarations
# rather than a pipeline, and generate a constitutional OS through the stratum chain. Open by
# registration; no layer redesign for an unknown dimension, capability, stratum or OS.
ucos-mcos = "engine.civilization.cli:main"
# UAPF-000001: Universal Autonomous Pipeline Framework — the constitutional execution
# foundation for every autonomous activity. Discovers the declared pipeline catalogue,
# derives every plan from the declarations, and reports or gates. Declaring this entry point
# is what keeps the framework and its catalogue reachable (RCH-ENTRYPOINT) rather than
# measured as a dead engine. AUTHORITY = NONE (DERIVED TRUTH); writes nothing.
ucos-uapf = "platform.universal_pipeline.cli:main"
# Ω-A05 — Universal Foundation capabilities. Each is a reusable Foundation service with its own
# one-command surface, so "what is Truth", "who owns this", "assimilate this source" and "measure
# this" are invocable capabilities (RCH-ENTRYPOINT) rather than logic buried in one engine.
# AUTHORITY = NONE (DERIVED TRUTH); every one of them reads Truth and writes none.
ucos-truth = "platform.universal_truth.cli:main"
ucos-ownership = "platform.universal_ownership.cli:main"
ucos-assimilate = "platform.universal_assimilation.cli:main"
ucos-foundation = "platform.universal_foundation.cli:main"
# Ω-A07 — the Foundation's own law and the measurement framework it is configured by. Both are
# Foundation capabilities under UCOS-UFC-001 and UFC-06 requires each to be invocable in one
# command, so the entry point is what makes the article true rather than aspirational.
ucos-constitution = "platform.universal_foundation.constitution_cli:main"
ucos-measurement = "platform.universal_measurement.cli:main"
# Ω-PROD-01 — the first production generator. It turns one Ω Nucleus declaration into the
# complete constitutional artifact set that nucleus requires, and writes nothing: a plan is a
# determination, and materialising it is a constituent act under the authority that owns the
# Truth it would enter. AUTHORITY = NONE (DERIVED TRUTH).
ucos-generate = "platform.universal_generator.cli:main"
# W3-4 — four capabilities shipped a cli module that no console script published, so the
# surface existed and was unreachable except as `python -m`. Each name below is the one its
# own parser already declares as `prog=`, so publishing registers what the code asserts
# rather than deciding anything: a capability's one-command surface is the capability's to
# name (RCH-ENTRYPOINT), not the packaging file's.
ucos-uckp = "engine.uckp.cli:main"
ucos-commercial = "platform.commercial_intelligence.cli:main"
ucos-repo-intel = "platform.repository_intelligence.cli:main"
ucos-provider = "platform.universal_provider.cli:main"
# UCOS-CTRL-000001: Universal Control Plane — the engineering operating system across all
# UCOS capabilities. Its parser already declares `prog="ucos-ctrl"`, so publishing the entry
# point registers the one-command surface the capability names for itself (RCH-ENTRYPOINT)
# rather than leaving `state`/`registries`/`plan`/`roadmap`/`backlog`/`schedule`/`dashboard`
# reachable only as `python -m`. AUTHORITY = NONE (DERIVED TRUTH); writes nothing.
ucos-ctrl = "platform.universal_control_plane.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "platform*"]
exclude = ["engine.tests*", "platform.tests*"]

[tool.setuptools.package-data]
# TASK-000032: ship the canonical BP-DATA reproducibility fixture with the wheel.
"engine.determinism" = ["blueprints/*.json"]
# UAPF-000001: ship the declared pipeline catalogue. It is DATA, not code — the Evolution and
# Build pipelines are declarations the framework derives, so an installed wheel without the
# catalogue would be a framework with nothing to run.
"platform.universal_pipeline" = ["catalog/*.json"]
# UCXI-000001 Part 15: ship the declared reference frames. They are DATA, not code — the
# whole point of the location architecture is that no axis value appears in a module, so an
# installed wheel without the catalogue is a resolver with nothing to resolve from, and
# every axis would fail closed as unresolved.
"engine.context" = ["catalog/*.json"]
# Ω-A05: ship the declared Foundation specialisations. They are DATA, not code — the Repository
# Truth policy, the governed ownership declarations and the project specialisation are the ONLY
# places a project's own names appear, so an installed wheel without them is a Foundation with
# nothing to specialise.
"platform.universal_truth" = ["catalog/*.json"]
"platform.universal_ownership" = ["catalog/*.json"]
"platform.universal_foundation" = ["catalog/*.json"]
# Ω-A07: the measurement policy composition is declared data too — which measurements bind, and
# how strongly, is configuration and not code (UFC-04).
"platform.universal_measurement" = ["catalog/*.json"]

# --- TASK-000009: test + coverage configuration ---------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
# UCOS-CL-008 — intelligence/tests joins the canonical collection.
#
# The determination this settles: intelligence/ IS part of the certified corpus. It is not
# a side lane. UCOS-RIE-001 emits ELEVEN TRACKED artifacts under intelligence/ that the
# RIB → AEE → P0-FCL-002 chain consumes as evidence, and Phase-9 certifies their bytes. A
# producer of certified artifacts whose tests never run in the certifying command is a
# capability the certification does not actually cover.
#
# Measured consequence of its absence: the coverage-isolation regression added at be46a300
# lived in intelligence/tests/test_rie.py and was therefore collected by NOTHING —
# not ./verify.sh, not CI, not the certification pipeline. The invariant it claimed to
# guard was unguarded, and the residual leak through analysis.py (UCOS-CL-005) shipped
# under it. Adding the path is what makes that regression real rather than decorative.
#
# The coverage DENOMINATOR is deliberately a separate question, answered separately below:
# these tests entering collection does not by itself put intelligence/* into --cov.
testpaths = ["engine/tests", "platform/tests", "intelligence/tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--cov=engine.foundation",
  "--cov=engine.registry",
  "--cov=engine.discovery",
  "--cov=engine.compiler",
  "--cov=engine.determinism",
  "--cov=engine.runtime",
  "--cov=engine.factory",
  "--cov=engine.validation",
  "--cov=engine.certification",
  "--cov=engine.universal_certification",
  "--cov=engine.acceptance",
  "--cov=engine.governance",
  "--cov=engine.knowledge",
  "--cov=engine.graph",
  "--cov=engine.context",
  # CMG-000002 — the Universal Temporal Existence Contract, as executable law. It enters
  # the denominator because it ships with engine/tests/unit/test_temporal_contract.py, and
  # because a temporal contract nobody measures is how UTC got hard-coded in the first
  # place (00-BOOK/tools/ukb.py::_now, gap G1 in the identity-universe determination).
  "--cov=engine.temporal",
  # UOBC-000001 — the Universal Object Birth Contract: identity derived before the
  # artifact exists. Measured for the same reason, and because its eight law checks are
  # the only executable statement of "no anonymous objects, no post-creation registration".
  "--cov=engine.object_birth",
  # UISD-000001 — Universal Infinite Scope and Direction. It enters the denominator on the
  # same condition every other capability does: it ships with
  # engine/tests/unit/test_infinite_scope.py. It is measured for a sharper reason too —
  # the unboundedness property was previously certified only in prose, and
  # 04-HIDDEN-FINITE-ASSUMPTION-CERTIFICATION.md §4 states that no exhaustive proof of
  # absence was performed. An unmeasured law about the absence of finite assumptions is
  # exactly how a finite assumption survives.
  "--cov=engine.infinite_scope",
  # UCPA-000001 — the constitutional primitive alignment gate. Measured under the same
  # floor for the reason the programme itself exists: the root ontology was RATIFIED and
  # then went unmeasured, and an unmeasured law about the primitives is exactly how a
  # superseded primitive form survives. A gate whose own refusal paths are unexercised
  # cannot be relied on to refuse.
  "--cov=engine.root_ontology",
  # ULP — the Universal Lineage Projection. Measured under the same floor because it is a
  # DERIVED answer: an unmeasured composition can report an ancestry no source declares and
  # look exactly like a correct one. F-1 was that failure at the projection layer, and the
  # refusal paths here are what keep it detectable.
  "--cov=engine.lineage",
  # RCM — the Registry Coverage Matrix. Measured under the same floor because it is the
  # instrument that says whether every governed object is registered: an unmeasured
  # coverage report can answer "fully covered" without ever having computed it, and that
  # answer is indistinguishable from a correct one.
  "--cov=engine.registry_coverage",
  # The Verification Impact Engine selects which verification a change requires, so it
  # is measured under the same floor as everything it selects for. An unmeasured
  # selector could narrow a run on a code path nothing exercised.
  "--cov=engine.verification_impact",
  # UVI-000001 — Universal Verification Intelligence, for the same reason and more
  # sharply: it decides which stages run, how the suite is partitioned, and whether a
  # result may be answered from evidence. An unmeasured code path in THAT is a path that
  # could narrow a run, drop a shard or reuse a stale result, and the symptom of every
  # one of those is a faster green run.
  "--cov=engine.verification_intelligence",
  # UCOS-CEU-001 — the Constitutional Existence substrate enters the denominator on the
  # same condition every other capability does: it ships with engine/tests/ceu/, so the
  # percentage measures a capability something actually exercises.
  "--cov=engine.ceu",
  # UCOS-NUC-001 — the Nucleus Ownership Authority enters the denominator on the same
  # condition W3-4c applied: it ships with engine/tests/nucleus/, so the percentage
  # measures a capability something actually exercises.
  "--cov=engine.nucleus",
  "--cov=engine.kernel",
  "--cov=engine.provider",
  "--cov=engine.civilization",
  "--cov=engine.uckp",
  "--cov=engine.uaue",
  "--cov=platform.foundation",
  "--cov=platform.identity",
  "--cov=platform.administration",
  "--cov=platform.security",
  "--cov=platform.projects",
  "--cov=platform.blueprints",
  "--cov=platform.generation",
  "--cov=platform.artifact_explorer",
  "--cov=platform.execution_dashboard",
  "--cov=platform.coverage",
  "--cov=platform.measurement",
  "--cov=platform.validation",
  "--cov=platform.certification",
  "--cov=platform.runtime_operations",
  "--cov=platform.repository_operations",
  "--cov=platform.universal_validation",
  "--cov=platform.validation_intelligence",
  "--cov=platform.universal_portal",
  "--cov=platform.runtime_platform",
  "--cov=platform.universal_pipeline",
  "--cov=platform.universal_truth",
  "--cov=platform.universal_ownership",
  "--cov=platform.universal_assimilation",
  "--cov=platform.universal_measurement",
  "--cov=platform.universal_foundation",
  "--cov=platform.universal_generator",
  # W3-4 — capabilities that were tested but absent from the denominator, so the gate
  # reported a percentage of a corpus smaller than the one that ships. platform.providers
  # joined once it had tests (W3-4b); platform.universal_assurance joins here (W3-4c) on
  # the same condition, now satisfied — all fourteen modules carry suites, so the gate
  # measures a capability that something actually tests rather than absorbing 2,297
  # unexercised statements as a `capability-unregistered-coverage` advisory.
  "--cov=platform.universal_assurance",
  "--cov=platform.commercial_intelligence",
  "--cov=platform.observability",
  "--cov=platform.portal",
  "--cov=platform.providers",
  "--cov=platform.repository_intelligence",
  "--cov=platform.universal_provider",
  "--cov=platform.workspace",
  # UCOS-CTRL-000001 — the Universal Control Plane joins the denominator on the same
  # condition W3-4c applied to platform.universal_assurance: it enters the gate carrying
  # its own suite (platform/tests/test_universal_control_plane.py), so the percentage
  # measures a capability something actually exercises.
  "--cov=platform.universal_control_plane",
  # UCOS-CTRL-STATE-000001 (Wave 11) — Universal Project State enters the denominator on the
  # same condition: it ships with platform/tests/test_universal_project_state.py, so the
  # percentage measures a capability something actually exercises.
  "--cov=platform.universal_project_state",
  # UCOS-CTRL-PLAN-000001 (Wave 12) — the Master Plan Engine enters the denominator on the
  # same condition: it ships with platform/tests/test_universal_master_plan.py, so the
  # percentage measures a capability something actually exercises.
  "--cov=platform.universal_master_plan",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=90",
]

[tool.coverage.run]
branch = true
source = ["engine/foundation", "engine/registry", "engine/graph", "engine/context", "engine/ceu", "engine/nucleus", "engine/kernel", "engine/provider", "engine/civilization", "engine/discovery", "engine/compiler", "engine/determinism", "engine/runtime", "engine/factory", "engine/validation", "engine/certification", "engine/universal_certification", "engine/acceptance", "engine/governance", "engine/knowledge", "engine/uckp", "engine/uaue", "engine/infinite_scope", "engine/root_ontology", "engine/lineage", "engine/registry_coverage", "platform/foundation", "platform/identity", "platform/administration", "platform/security", "platform/projects", "platform/blueprints", "platform/generation", "platform/artifact_explorer", "platform/execution_dashboard", "platform/coverage", "platform/measurement", "platform/validation", "platform/certification", "platform/runtime_operations", "platform/repository_operations", "platform/universal_validation", "platform/universal_portal", "platform/runtime_platform", "platform/validation_intelligence", "platform/universal_pipeline", "platform/universal_truth", "platform/universal_ownership", "platform/universal_assimilation", "platform/universal_measurement", "platform/universal_foundation", "platform/universal_generator", "platform/universal_assurance", "platform/commercial_intelligence", "platform/observability", "platform/portal", "platform/providers", "platform/repository_intelligence", "platform/universal_provider", "platform/workspace", "platform/universal_control_plane", "platform/universal_project_state", "platform/universal_master_plan", "engine/object_birth", "engine/temporal", "engine/verification_impact", "engine/verification_intelligence"]
omit = ["engine/tests/*", "platform/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

# --- Lint / secure-coding (CD-01 conventions, CD-04 secure coding) ---------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I import-sort, B bugbear, UP pyupgrade, S bandit (security).
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert (S101) and secret-like literals in fixtures (S105/S106).
"engine/tests/*" = ["S101", "S105", "S106"]
"platform/tests/*" = ["S101", "S105", "S106"]
